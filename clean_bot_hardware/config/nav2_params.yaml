# #############################################################################
# NAV2 STACK CONFIGURATION
# 
# FILE DESCRIPTION:
# This file contains parameters for all nodes in the Navigation2 stack, 
# including AMCL (localization), BT Navigator (behavior trees), 
# Controller Server (local planning), Planner Server (global planning), 
# and Costmaps.
#
# KEY PARAMETERS:
# - robot_model_type: DifferentialMotionModel (For two-wheeled drive).
# - inflation_layer: Configured for a small (~20cm) footprint.
# - scan_topic: /scan (Used for both localization and obstacle avoidance).
# - odom_frame: odom.
# - base_frame: base_link.
#
# ASSUMPTIONS:
# - The robot is a differential drive platform.
# - A map is available for AMCL (if used) or SLAM is publishing the map frame.
# - The sensor suite includes at least a 2D LiDAR.
# #############################################################################

# Nav2 Parameters for Clean Bot
# Optimized for small indoor robot with differential drive
# Robot width: ~20cm, Coverage width: 14cm

amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.12
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    # 10ms => 100Hz tick. On Pi-class CPUs this often overruns and spams warnings.
    bt_loop_duration: 50
    default_server_timeout: 20
    enable_groot_monitoring: False
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    # Jazzy auto-loads Nav2 BT plugin libraries; keep this focused on navigator plugins.
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: False
    autostart: True
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    # Output to cmd_vel_nav - emergency_stop filters and sends to cmd_vel
    # NOTE: Do NOT set cmd_vel_topic here - the Nav2 launch file already
    # remaps cmd_vel -> cmd_vel_nav at the RMW level.  Setting the parameter
    # too would double-remap and break the velocity_smoother chain.

    # Progress checker - more forgiving for slow exploration
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15  # Only need to move 15cm
      movement_time_allowance: 20.0   # Give 20 seconds to make progress

    # Goal checker - for coverage, we need precise positioning
    general_goal_checker:
      stateful: False  # was True: caused false "reached" when position latch wasn't reset
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05  # 10cm tolerance
      yaw_goal_tolerance: 0.08  # ~15 degrees

    # DWB Controller - good for differential drive
    # Configured for spin-then-drive: robot rotates to face goal, then drives straight
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: 0.0           # Allow pure rotation
      min_vel_y: 0.0
      max_vel_x: 0.15          # Max forward speed (m/s)
      max_vel_y: 0.0           # No lateral movement (diff drive)
      max_vel_theta: 0.8       # Normal rotation speed
      min_speed_xy: 0.0        # Allow stopping for in-place rotation
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 0.5
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -0.5
      vx_samples: 10
      vy_samples: 0
      vtheta_samples: 10
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 1.0
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.05
      ObstacleFootprint.scale: 0.5
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.2
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.2
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      # RotateToGoal: rotate in place first, then drive straight
      RotateToGoal.scale: 48.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.03       # 3cm resolution
      robot_radius: 0.20     # Robot body radius 20cm
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5       # Lower = costs spread further
        inflation_radius: 0.20         # INCREASED - 35cm inflation for safety
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        combination_method: 1  # Max - take worst case from all sensors
        observation_sources: scan low_obstacles
        # Lidar at 17cm height - walls, furniture, large obstacles
        scan:
          topic: /scan
          sensor_frame: laser
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        # Ultrasonic-derived points for low obstacles.
        # Published in base_link frame by low_obstacle_detector (fixed offset).
        low_obstacles:
          topic: /low_obstacles
          sensor_frame: base_link
          max_obstacle_height: 0.15  # Only care about low stuff
          min_obstacle_height: 0.0
          clearing: False           # Don't clear - lidar handles that
          marking: True             # Mark obstacles
          data_type: "PointCloud2"
          obstacle_max_range: 0.5   # 50cm range
          obstacle_min_range: 0.05  # 5cm min
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      # IMPORTANT: global_costmap must cover the whole explored map during scanning.
      # A rolling global costmap can cause planner_server to fail (worldToMap failed)
      # when frontier goals fall outside the rolling window.
      rolling_window: false
      width: 30
      height: 30
      origin_x: -15.0
      origin_y: -15.0
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      robot_radius: 0.20
      resolution: 0.05       # 5cm resolution
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        combination_method: 1  # Max - take worst case from all sensors
        observation_sources: scan
        # Lidar at 17cm height
        scan:
          topic: /scan
          sensor_frame: laser
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5       # Lower = costs spread further  
        inflation_radius: 0.20         # INCREASED - 35cm inflation for safety
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 1.0         # Increased tolerance for exploration
      use_astar: true        # A* is better for exploration
      allow_unknown: true    # Critical for SLAM - allow planning through unknown space

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Keep spin but make it very slow
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 1.0
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5    # Normal spin speed for recovery
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.5

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.15, 0.0, 0.8]    # Match controller max_vel_theta
    min_velocity: [-0.15, 0.0, -0.8]
    max_accel: [0.5, 0.0, 0.5]
    max_decel: [-0.5, 0.0, -0.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: False
    enabled: True
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.5
    source_timeout: 1.0
    stop_pub_timeout: 1.0
    enable_stamped_cmd_vel: False

    polygons: ["PolygonStop"]
    PolygonStop:
      type: "circle"
      radius: 0.30
      action_type: "stop"
      min_points: 4
      visualize: False
      enabled: True

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      source_timeout: 0.2
      enabled: True
